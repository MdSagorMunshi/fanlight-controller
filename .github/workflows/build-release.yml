name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-packages:
    name: Build Multi-Platform Release Packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update && sudo apt-get install -y dpkg-dev zip tar

      - name: Build Debian (.deb) amd64 Package
        run: |
          mkdir -p pkg_amd64/DEBIAN pkg_amd64/opt/fanlight-studio pkg_amd64/usr/bin pkg_amd64/usr/share/applications pkg_amd64/usr/share/icons/hicolor/128x128/apps pkg_amd64/etc/udev/rules.d
          
          cat << 'EOF' > pkg_amd64/DEBIAN/control
          Package: fanlight-studio
          Version: 1.0.0
          Architecture: amd64
          Maintainer: FanLight Studio Contributors
          Depends: python3 (>= 3.10), python3-pyqt6, python3-pil, python3-numpy
          Section: utils
          Priority: optional
          Homepage: https://github.com/MdSagorMunshi/fanlight-controller
          Description: Next-Generation Linux Desktop Lighting Deck for MSI AM5 & DDR5 RAM RGB
          EOF

          cat << 'EOF' > pkg_amd64/DEBIAN/postinst
          #!/bin/sh
          set -e
          if command -v udevadm >/dev/null 2>&1; then
              udevadm control --reload-rules || true
              udevadm trigger || true
          fi
          exit 0
          EOF
          chmod 755 pkg_amd64/DEBIAN/postinst

          cp -r assets main.py ui.py widgets.py backend.py requirements.txt pkg_amd64/opt/fanlight-studio/
          
          cat << 'EOF' > pkg_amd64/usr/bin/fanlight-studio
          #!/bin/sh
          exec /usr/bin/python3 /opt/fanlight-studio/main.py "$@"
          EOF
          chmod 755 pkg_amd64/usr/bin/fanlight-studio

          cp assets/icon.png pkg_amd64/usr/share/icons/hicolor/128x128/apps/fanlight-studio.png
          cp FanLightControl.desktop pkg_amd64/usr/share/applications/FanLightControl.desktop

          cat << 'EOF' > pkg_amd64/etc/udev/rules.d/60-msi-mysticlight.rules
          SUBSYSTEM=="hidraw", ATTRS{idVendor}=="0db0", ATTRS{idProduct}=="0076", MODE="0666", TAG+="uaccess"
          SUBSYSTEM=="hidraw", ATTRS{idVendor}=="0db0", ATTRS{idProduct}=="0080", MODE="0666", TAG+="uaccess"
          SUBSYSTEM=="hidraw", ATTRS{idVendor}=="0db0", ATTRS{idProduct}=="0083", MODE="0666", TAG+="uaccess"
          SUBSYSTEM=="hidraw", ATTRS{idVendor}=="0db0", ATTRS{idProduct}=="0087", MODE="0666", TAG+="uaccess"
          KERNEL=="i2c-[0-9]*", GROUP="i2c", MODE="0666"
          EOF

          dpkg-deb --root-owner-group --build pkg_amd64 fanlight-studio_1.0.0_amd64.deb

      - name: Build Debian (.deb) arm64 Package
        run: |
          mkdir -p pkg_arm64/DEBIAN pkg_arm64/opt/fanlight-studio pkg_arm64/usr/bin pkg_arm64/usr/share/applications pkg_arm64/usr/share/icons/hicolor/128x128/apps pkg_arm64/etc/udev/rules.d
          
          cat << 'EOF' > pkg_arm64/DEBIAN/control
          Package: fanlight-studio
          Version: 1.0.0
          Architecture: arm64
          Maintainer: FanLight Studio Contributors
          Depends: python3 (>= 3.10), python3-pyqt6, python3-pil, python3-numpy
          Section: utils
          Priority: optional
          Homepage: https://github.com/MdSagorMunshi/fanlight-controller
          Description: Next-Generation Linux Desktop Lighting Deck for MSI AM5 & DDR5 RAM RGB (ARM64)
          EOF

          cat << 'EOF' > pkg_arm64/DEBIAN/postinst
          #!/bin/sh
          set -e
          if command -v udevadm >/dev/null 2>&1; then
              udevadm control --reload-rules || true
              udevadm trigger || true
          fi
          exit 0
          EOF
          chmod 755 pkg_arm64/DEBIAN/postinst

          cp -r assets main.py ui.py widgets.py backend.py requirements.txt pkg_arm64/opt/fanlight-studio/
          
          cat << 'EOF' > pkg_arm64/usr/bin/fanlight-studio
          #!/bin/sh
          exec /usr/bin/python3 /opt/fanlight-studio/main.py "$@"
          EOF
          chmod 755 pkg_arm64/usr/bin/fanlight-studio

          cp assets/icon.png pkg_arm64/usr/share/icons/hicolor/128x128/apps/fanlight-studio.png
          cp FanLightControl.desktop pkg_arm64/usr/share/applications/FanLightControl.desktop

          cat << 'EOF' > pkg_arm64/etc/udev/rules.d/60-msi-mysticlight.rules
          SUBSYSTEM=="hidraw", ATTRS{idVendor}=="0db0", ATTRS{idProduct}=="0076", MODE="0666", TAG+="uaccess"
          SUBSYSTEM=="hidraw", ATTRS{idVendor}=="0db0", ATTRS{idProduct}=="0080", MODE="0666", TAG+="uaccess"
          SUBSYSTEM=="hidraw", ATTRS{idVendor}=="0db0", ATTRS{idProduct}=="0083", MODE="0666", TAG+="uaccess"
          SUBSYSTEM=="hidraw", ATTRS{idVendor}=="0db0", ATTRS{idProduct}=="0087", MODE="0666", TAG+="uaccess"
          KERNEL=="i2c-[0-9]*", GROUP="i2c", MODE="0666"
          EOF

          dpkg-deb --root-owner-group --build pkg_arm64 fanlight-studio_1.0.0_arm64.deb

      - name: Build Linux Tarballs (x86_64 & arm64)
        run: |
          mkdir -p tar_x86/fanlight-studio-v1.0.0-linux-x86_64
          cp -r assets main.py ui.py widgets.py backend.py requirements.txt install.sh README.md LICENSE FanLightControl.desktop tar_x86/fanlight-studio-v1.0.0-linux-x86_64/
          tar -czf fanlight-studio-v1.0.0-linux-x86_64.tar.gz -C tar_x86 fanlight-studio-v1.0.0-linux-x86_64

          mkdir -p tar_arm/fanlight-studio-v1.0.0-linux-arm64
          cp -r assets main.py ui.py widgets.py backend.py requirements.txt install.sh README.md LICENSE FanLightControl.desktop tar_arm/fanlight-studio-v1.0.0-linux-arm64/
          tar -czf fanlight-studio-v1.0.0-linux-arm64.tar.gz -C tar_arm fanlight-studio-v1.0.0-linux-arm64

      - name: Build Windows Portable Bundles (x86_64 & arm64)
        run: |
          # Windows x86_64
          mkdir -p win_x86/fanlight-studio-v1.0.0-windows-portable-x86_64
          cp -r assets main.py ui.py widgets.py backend.py requirements.txt README.md LICENSE win_x86/fanlight-studio-v1.0.0-windows-portable-x86_64/
          
          cat << 'EOF' > win_x86/fanlight-studio-v1.0.0-windows-portable-x86_64/run_fanlight.bat
          @echo off
          title FanLight Studio
          where python >nul 2>nul
          if %ERRORLEVEL% NEQ 0 (
              echo [ERROR] Python 3 is not found in PATH!
              pause
              exit /b 1
          )
          python -m pip install -q -r requirements.txt
          start pythonw main.py
          exit /b 0
          EOF

          cat << 'EOF' > win_x86/fanlight-studio-v1.0.0-windows-portable-x86_64/launch_silent.vbs
          Set WshShell = CreateObject("WScript.Shell")
          WshShell.Run "pythonw.exe main.py", 0, False
          EOF

          (cd win_x86 && zip -r ../fanlight-studio-v1.0.0-windows-portable-x86_64.zip fanlight-studio-v1.0.0-windows-portable-x86_64)

          # Windows ARM64
          mkdir -p win_arm/fanlight-studio-v1.0.0-windows-arm64
          cp -r assets main.py ui.py widgets.py backend.py requirements.txt README.md LICENSE win_arm/fanlight-studio-v1.0.0-windows-arm64/
          
          cat << 'EOF' > win_arm/fanlight-studio-v1.0.0-windows-arm64/run_fanlight.bat
          @echo off
          title FanLight Studio (Windows ARM64)
          where python >nul 2>nul
          if %ERRORLEVEL% NEQ 0 (
              echo [ERROR] Python 3 is not found in PATH!
              echo Please install Python 3 for Windows ARM64 from python.org or the Microsoft Store.
              pause
              exit /b 1
          )
          python -m pip install -q -r requirements.txt
          start pythonw main.py
          exit /b 0
          EOF

          cat << 'EOF' > win_arm/fanlight-studio-v1.0.0-windows-arm64/launch_silent.vbs
          Set WshShell = CreateObject("WScript.Shell")
          WshShell.Run "pythonw.exe main.py", 0, False
          EOF

          (cd win_arm && zip -r ../fanlight-studio-v1.0.0-windows-arm64.zip fanlight-studio-v1.0.0-windows-arm64)

      - name: Publish Release to GitHub
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            fanlight-studio_1.0.0_amd64.deb
            fanlight-studio_1.0.0_arm64.deb
            fanlight-studio-v1.0.0-linux-x86_64.tar.gz
            fanlight-studio-v1.0.0-linux-arm64.tar.gz
            fanlight-studio-v1.0.0-windows-portable-x86_64.zip
            fanlight-studio-v1.0.0-windows-arm64.zip
          generate_release_notes: true
