name: 🐛 Bug Report
description: Report hardware collisions, dark fans, RAM desync, or UI errors.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please provide as much hardware and diagnostic detail as possible to help us reproduce and resolve it.

  - type: textarea
    id: description
    attributes:
      label: 📝 Description of the Bug
      description: A clear and concise description of what went wrong.
      placeholder: e.g. Case fans remain unlit when selecting Static color, or app crashes on launch.
    validations:
      required: true

  - type: input
    id: motherboard
    attributes:
      label: 🖥️ Motherboard Model & BIOS Version
      description: Run `cat /sys/class/dmi/id/board_name` and `cat /sys/class/dmi/id/bios_version` in terminal.
      placeholder: e.g. MSI B650M GAMING WIFI (MS-7E30), BIOS 1.F2
    validations:
      required: true

  - type: input
    id: distro_kernel
    attributes:
      label: 🐧 Linux Distribution & Kernel Version
      description: Run `uname -a` or `cat /etc/os-release`.
      placeholder: e.g. Kali Linux 2026.x / Ubuntu 24.04 (Kernel 6.10.x)
    validations:
      required: true

  - type: dropdown
    id: affected_component
    attributes:
      label: ⚡ Hardware Component Affected
      options:
        - Case Fans & ARGB Headers (JARGB_V2_1 / JARGB_V2_2)
        - Analog RGB Header (JRGB1 / 12V)
        - RAM RGB (ENE DRAM SMBus 0x72)
        - Both Case Fans and RAM
        - UI / Desktop Display / State Sync
        - Permissions / udev Error
    validations:
      required: true

  - type: input
    id: hidraw_node
    attributes:
      label: 🔌 Device Node & Permissions
      description: Run `ls -l /dev/hidraw*` and `cat /sys/class/hidraw/*/device/uevent | grep -i 0db0`.
      placeholder: e.g. /dev/hidraw4, crw-rw-rw-+ root plugdev (HID_ID=0003:00000DB0:00000076)

  - type: textarea
    id: steps_to_reproduce
    attributes:
      label: 👣 Steps to Reproduce
      description: Step-by-step instructions on how you triggered the problem.
      placeholder: |
        1. Launch FanLight Studio via terminal: `python3 main.py`
        2. Click on 'Rainbow Wave' or choose a custom color
        3. Turn power toggle to OFF, then ON
        4. See error or observe unlit fans
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 📋 Terminal Logs & Error Traceback
      description: Paste any logs or tracebacks output to terminal.
      render: shell

  - type: checkboxes
    id: checklist
    attributes:
      label: ✅ Pre-flight Checks
      options:
        - label: I have run `./install.sh` or verified that my user has permissions to access `/dev/hidraw*`.
          required: true
        - label: I verified that the kernel `i2c-dev` module is loaded (`lsmod | grep i2c_dev`).
          required: false
        - label: I searched existing issues to ensure this is not a duplicate.
          required: true
